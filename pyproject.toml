[project]
name = "langchain-course"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sylvain Chambon", email = "30735585+schambon77@users.noreply.github.com" }
]
requires-python = ">=3.10"
dependencies = [
    "black>=25.11.0",
    "isort>=6.1.0",
    "langchain>=1.0.0",
    "langchain-anthropic>=0.3.22",
    "langchain-tavily>=0.2.11",
    "python-dotenv>=1.2.1",
    "tavily>=1.1.0",
